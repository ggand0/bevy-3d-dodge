# PPO Level 2 Basic 3D - Very Narrow Spawn Angle Experiment
# Training with ±20° spawn angle (narrower than ±30°) and 2x sprint
# Usage: python python/train_ppo.py --config python/configs/ppo_level2_basic3d_narrow20.yaml

algorithm: PPO
port: 8000
level: 2  # Difficulty level (1 = Baseline, 2 = Hard)
action_space_type: basic_3d  # 3D: [vx, vy, sprint]

# Environment tuning
sprint_multiplier: 1.0       # 2x speed at full sprint (base 5 -> 10)
spawn_angle_degrees: 20      # ±20° = 40° total fan (very narrow)

# Training
total_timesteps: 500000  # 500K steps for full training
learning_rate: 0.0003

# PPO-specific
n_steps: 2048           # Standard rollout buffer size
batch_size: 64          # Standard batch size
n_epochs: 10            # Standard number of epochs
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01          # Encourage exploration for harder difficulty
vf_coef: 0.5
max_grad_norm: 0.5

# Network architecture
net_arch: [256, 256]    # Same network size for fair comparison

# Checkpointing & Evaluation
save_freq: 25000        # Save every 25K steps
eval_freq: 10000        # Evaluate every 10K steps
n_eval_episodes: 10     # More episodes for robust evaluation

# Device
device: auto
