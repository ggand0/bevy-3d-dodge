# SAC with Parallel Environments for Faster CNN Training
#
# Uses multiple game instances for ~N× faster data collection.
# Requires starting N game servers first:
#   ./start_parallel_servers.sh 4
#
# Then train:
#   uv run python python/train_sac.py --config python/configs/sac_topdown_cnn_parallel.yaml

algorithm: SAC

# Parallel environment settings
n_envs: 2              # Number of parallel game instances
port: 8000             # Starting port (uses 8000-8003)

level: 2               # Difficulty level (1 = Baseline, 2 = Hard)
action_space_type: basic_3d  # 3D: [vx, vy, sprint] - SAC requires continuous

# Image observation mode (84x84 default)
observation_mode: topdown     # 84x84 RGB top-down view (uses CnnPolicy)
frame_stack: 4                # Stack 4 frames for velocity inference
image_grayscale: true         # 1 channel instead of 3 = 3x smaller CNN input

# Arena tuning
spawn_angle_degrees: 30       # ±30° = 60° total fan (easier for CNN learning)
sprint_multiplier: 1.0        # 2x speed at full sprint

# Training
total_timesteps: 500000   # 500K steps
learning_rate: 0.0003     # SAC default

# SAC-specific parameters
buffer_size: 100000       # Replay buffer size
learning_starts: 10000    # Steps before training starts
batch_size: 128           # Batch size
tau: 0.005                # Soft update coefficient
train_freq: 4             # Update every 4 steps
gradient_steps: 1         # Gradient steps per environment step
ent_coef: auto            # Automatic entropy tuning

# Common parameters
gamma: 0.99               # Discount factor

# Network architecture
net_arch: [256, 256]      # Two hidden layers after CNN features

# Checkpointing & Evaluation
save_freq: 50000          # Save every 50K steps
eval_freq: 10000          # Evaluate every 10K steps
n_eval_episodes: 5        # Evaluation episodes per eval

# Device
device: auto
