# PPO Level 2 Basic 3D - Extended Training with ±30° Spawn Angle
# Longer training (1M steps) with stability tweaks for smooth convergence
# Usage: python python/train_ppo.py --config python/configs/ppo_level2_basic3d_narrow_long.yaml

algorithm: PPO
port: 8000
level: 2  # Difficulty level (1 = Baseline, 2 = Hard)
action_space_type: basic_3d  # 3D: [vx, vy, sprint]

# Environment tuning (best config from experiments)
sprint_multiplier: 1.0       # 2x speed at full sprint (base 5 -> 10)
spawn_angle_degrees: 30      # ±30° = 60° total fan

# Training - Extended duration with stability tweaks
total_timesteps: 1000000  # 1M steps for full convergence
learning_rate: 0.0001    # 3x lower for stable updates (was 0.0003)

# PPO-specific
n_steps: 2048           # Standard rollout buffer size
batch_size: 64          # Standard batch size
n_epochs: 10            # Standard number of epochs
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.15        # Tighter clipping for stability (was 0.2)
ent_coef: 0.01          # Encourage exploration
vf_coef: 0.5
max_grad_norm: 0.5

# Network architecture
net_arch: [256, 256]    # Same network size

# Checkpointing & Evaluation
save_freq: 50000        # Save every 50K steps
eval_freq: 10000        # Evaluate every 10K steps
n_eval_episodes: 10     # Robust evaluation

# Device
device: auto
