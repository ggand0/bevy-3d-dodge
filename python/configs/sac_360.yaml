# SAC 360° Full Coverage - Level 2
# Projectiles spawn from all directions around the player
# Usage: uv run --directory python python train_sac.py --config configs/sac_360.yaml

algorithm: SAC
transport: grpc
socket_path: /tmp/bevy_rl.sock
port: 8000
n_envs: 4
level: 2
action_space_type: basic_3d

# 360° spawn coverage
spawn_angle_degrees: 180      # ±180° = 360° full circle

# Observation mode
observation_mode: with_thrower    # 69-dim vector

# Training - 4M steps for harder 360° coverage
total_timesteps: 4000000
learning_rate: 0.0003

# SAC-specific parameters
buffer_size: 100000
learning_starts: 10000
batch_size: 256
tau: 0.005
train_freq: 1
gradient_steps: 1
ent_coef: auto

gamma: 0.99

# Network architecture - optimal [256, 256]
net_arch: [256, 256]

# Checkpointing & Evaluation
save_freq: 100000
eval_freq: 25000
n_eval_episodes: 10

device: auto
