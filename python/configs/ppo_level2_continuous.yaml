# PPO Level 2 (Hard) Continuous Action Space Configuration
# Full training on challenging difficulty with continuous actions (vx, vy, pitch, roll)
# Usage: python python/train_ppo.py --config python/configs/ppo_level2_continuous.yaml

algorithm: PPO
port: 8000
level: 2  # Difficulty level (1 = Baseline, 2 = Hard)
action_space_type: continuous  # Use continuous action space (Box)

# Training
total_timesteps: 500000  # 500K steps for full training
learning_rate: 0.0003

# PPO-specific
n_steps: 2048           # Standard rollout buffer size
batch_size: 64          # Standard batch size
n_epochs: 10            # Standard number of epochs
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01          # Encourage exploration for harder difficulty
vf_coef: 0.5
max_grad_norm: 0.5

# Network architecture
net_arch: [256, 256]    # Larger network for harder difficulty + continuous actions

# Checkpointing & Evaluation
save_freq: 25000        # Save every 25K steps
eval_freq: 10000        # Evaluate every 10K steps
n_eval_episodes: 10     # More episodes for robust evaluation

# Device
device: auto
