# PPO Level 2 Basic 3D - Clean 2M training for SAC comparison
# Same environment as SAC, standard PPO hyperparameters
# Usage: python python/train_ppo.py --config python/configs/ppo_level2_basic3d_2m.yaml

algorithm: PPO
port: 8000
level: 2
action_space_type: basic_3d  # 3D: [vx, vy, sprint]

# Environment - SAME as SAC config
sprint_multiplier: 1.0       # 2x speed at full sprint
spawn_angle_degrees: 30      # ±30° = 60° total fan

# Training
total_timesteps: 1000000     # 1M per run, resume for 2M total
learning_rate: 0.0003        # Standard PPO default (same as SAC)

# PPO-specific - standard defaults
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2              # Standard (not tightened)
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

# Network - SAME as SAC
net_arch: [256, 256]

# Checkpointing & Evaluation
save_freq: 50000
eval_freq: 10000
n_eval_episodes: 10

device: auto
